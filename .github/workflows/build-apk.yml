name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      openwrt_target:
        description: 'OpenWrt target/subtarget（决定 SDK 与包架构）'
        required: false
        default: 'mediatek/filogic'
      arch:
        description: 'OpenWrt ARCH'
        required: false
        default: 'aarch64'
      blob_arch:
        description: '守护进程二进制对应的架构名（arm64 / armv7 / amd64 ...）'
        required: false
        default: 'arm64'

permissions:
  contents: write

env:
  TARGET_DIR: ${{ inputs.openwrt_target || 'mediatek/filogic' }}
  OWRT_ARCH: ${{ inputs.arch || 'aarch64' }}
  BLOB_ARCH: ${{ inputs.blob_arch || 'arm64' }}
  RUST_TARGET: aarch64-unknown-linux-musl
  LAUNCHER_VERSION: 3.1.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 使用 Node LTS
        uses: actions/setup-node@v7
        with:
          # 'current' 每次都可能换成新的大版本，产物不可复现；LTS 足够跑语法检查与自测
          node-version: 'lts/*'
      - name: 前端语法与兼容层自测
        run: |
          node -v
          node --check src/luci-app-natfrp/htdocs/luci-static/resources/view/natfrp/main.js
          node scripts/test-inject.js

      - name: 使用最新稳定版 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}
          components: rustfmt

      - name: Rust 格式检查
        run: cd rust && cargo fmt --all -- --check

      - name: 用官方 Rust 工具链编译 natfrpctl
        run: |
          rustc -V
          cargo -V
          cd rust
          cargo test --locked
          RUSTFLAGS="-C link-self-contained=yes -C linker=rust-lld" \
            cargo build --release --locked --target "$RUST_TARGET"
          mkdir -p ../src/luci-app-natfrp/files
          cp "target/$RUST_TARGET/release/natfrpctl" "../src/luci-app-natfrp/files/natfrpctl-$OWRT_ARCH"
          strip "../src/luci-app-natfrp/files/natfrpctl-$OWRT_ARCH" || true
          file "../src/luci-app-natfrp/files/natfrpctl-$OWRT_ARCH"

      - name: 准备守护进程二进制（含完整性校验）
        run: |
          set -euo pipefail
          mkdir -p "src/luci-app-natfrp/files/blobs/$BLOB_ARCH" /tmp/vendor
          ipk="luci-app-natfrp_${BLOB_ARCH}.ipk"
          curl -fsSL -o "/tmp/vendor/$ipk" \
            "https://nya.globalslb.net/natfrp/client/launcher-openwrt/${LAUNCHER_VERSION}/${ipk}"

          # 官方这个 ipk 其实是 gzip 包着 tar（不是标准 ar 归档）。两种形态都兼容，
          # 免得上游哪天改回 ar 打包就把 CI 弄断。
          tar -xf "/tmp/vendor/$ipk" -C /tmp/vendor 2>/dev/null \
            || ( cd /tmp/vendor && ar x "$ipk" )
          tar -xzf /tmp/vendor/data.tar.gz -C /tmp/vendor ./usr/bin

          # 这些二进制会以 root 运行，且同一个 URL 的内容会变（上游重新打包过），
          # 所以按 scripts/vendor-sha256.txt 逐项校验；没收录的架构只警告、不阻断。
          for f in natfrp-service natfrp-frpc; do
            want=$(awk -v k="$BLOB_ARCH/$f" '$1 == k { print $2 }' scripts/vendor-sha256.txt)
            if [ -z "$want" ]; then
              echo "::warning::没有固定 $BLOB_ARCH/$f 的 sha256，本次跳过校验；核对后请补进 scripts/vendor-sha256.txt"
              continue
            fi
            got=$(sha256sum "/tmp/vendor/usr/bin/$f" | awk '{print $1}')
            if [ "$got" != "$want" ]; then
              echo "::error::$f 校验失败：期望 $want，实际 $got"
              exit 1
            fi
            echo "$f sha256 ok ($got)"
          done

          cp /tmp/vendor/usr/bin/natfrp-service /tmp/vendor/usr/bin/natfrp-frpc \
             "src/luci-app-natfrp/files/blobs/$BLOB_ARCH/"
          ls -l "src/luci-app-natfrp/files/blobs/$BLOB_ARCH"

      - name: 下载最新 OpenWrt SDK
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/snapshots/targets/${TARGET_DIR}/"
          sdk=$(curl -fsSL "$base" | grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' | head -1)
          test -n "$sdk" || { echo "未找到 SDK 包"; exit 1; }
          echo "SDK: $sdk"
          curl -fsSL -o /tmp/sdk.tar.zst "$base$sdk"
          mkdir -p /opt/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /opt/sdk --strip-components=1
          echo "SDK_DIR=/opt/sdk" >> "$GITHUB_ENV"

      - name: 编译 APK
        run: |
          set -euo pipefail
          cp -r src/* "$SDK_DIR/package/"
          cd "$SDK_DIR"
          # 先生成 .config，否则 make 会去开交互式 menuconfig（CI 里没有终端）
          make defconfig
          make package/luci-app-natfrp/compile -j"$(nproc)" V=s
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 只收我们自己的包，别把 SDK 里的 libc/libgcc 一起带上
          find bin -name 'luci-app-natfrp-*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: natfrp-apk-${{ inputs.arch || 'aarch64' }}
          path: out/*.apk
          if-no-files-found: error

      # 编译完成即发布正式版：打 tag 用 tag 名，分支推送滚动更新 latest
      - name: 发布到 Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          prerelease: false
          make_latest: 'true'
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: out/*.apk
          body: |
            aarch64_cortex-a53 单包 APK（OpenWrt 快照 / apk 包管理）。

            安装：
            ```
            apk add --allow-untrusted ./luci-app-natfrp-*.apk
            ```
            安装后到「服务 → SakuraFrp 内网穿透」填写访问密钥。

            **WebUI 默认走 HTTPS**（自签名证书，页面有「下载证书」按钮）。需要明文入口时
            在页面关闭 TLS，并确认设备装了 `openssl-util`（包依赖已声明）。

            **从官方 3.1.9 升级前请先备份 `/etc/natfrp/config.json`**：官方包的 pre-deinstall
            会 `rm -rf /etc/natfrp`，而 token 只保存在这个文件里。
